version: 2
before:
  hooks:
    - go mod tidy
builds:
  - main: ./cmd/tfunfold
    ldflags:
      - -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
checksum:
  name_template: "checksums.txt"
homebrew_casks:
  - repository:
      owner: winebarrel
      name: homebrew-tfunfold
    homepage: https://github.com/winebarrel/tfunfold
    description: tfunfold expands Terraform for_each / count into individual resources or modules with moved blocks.
    license: CC0-1.0
    # Homebrew 7 deprecates the postflight block that hooks.post.install
    # renders, so emit postflight_steps via custom_block instead. goreleaser
    # templates the whole cask, so {{staged_path}} is written as a template
    # producing that literal, expanded by Homebrew at install time. Move this
    # to the dedicated goreleaser field once it ships (goreleaser#6870).
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/tfunfold"]
        end
      end
